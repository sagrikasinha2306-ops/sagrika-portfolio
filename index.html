<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070a20;
      color: #fff;
      min-height: 100vh;
    }

    /* =========================
       CONTACT SECTION
    ========================= */

    .contact-section {
      width: 100%;
      min-height: 100vh;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 15% 20%, rgba(91, 75, 255, 0.15), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(185, 70, 255, 0.12), transparent 30%),
        #070a20;
    }

    .contact-container {
      width: 100%;
      max-width: 1500px;
      min-height: 680px;

      padding: 55px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(30, 34, 61, 0.96),
          rgba(12, 15, 38, 0.96)
        );

      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    /* =========================
       LEFT CONTENT
    ========================= */

    .contact-left {
      position: relative;
    }

    .contact-label {
      display: inline-block;

      padding: 12px 22px;
      margin-bottom: 28px;

      border-radius: 30px;

      background: linear-gradient(135deg, #6756ff, #4b65ed);

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;

      box-shadow: 0 8px 25px rgba(91, 83, 255, 0.25);
    }

    .contact-title {
      max-width: 650px;

      font-size: clamp(48px, 5vw, 76px);
      line-height: 0.98;
      letter-spacing: -3px;
      font-weight: 800;

      margin-bottom: 28px;
    }

    .gradient-text {
      background: linear-gradient(
        90deg,
        #765cff,
        #a68cff,
        #536cff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .contact-description {
      max-width: 610px;

      color: #b8bad0;
      font-size: 18px;
      line-height: 1.7;

      margin-bottom: 35px;
    }

    /* =========================
       SOCIAL LINKS
    ========================= */

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 40px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 12px;

      color: #fff;
      text-decoration: none;

      font-weight: 600;
      font-size: 16px;

      transition: 0.3s ease;
    }

    .contact-link:hover {
      transform: translateY(-3px);
      color: #9a8cff;
    }

    .link-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #745cff,
        #446cff
      );

      font-size: 19px;

      box-shadow: 0 8px 25px rgba(80, 80, 255, 0.25);
    }

    .link-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .link-text small {
      color: #9c9eb7;
      font-size: 12px;
    }

    /* =========================
       DECORATION
    ========================= */

    .decoration {
      position: relative;
      height: 150px;
      margin-top: 10px;
    }

    .blob {
      position: absolute;
      left: 0;
      bottom: 0;

      width: 250px;
      height: 100px;

      border-radius: 50% 50% 15px 15px;

      background: linear-gradient(
        135deg,
        rgba(104, 76, 255, 0.8),
        rgba(67, 57, 160, 0.4)
      );

      filter: blur(1px);
    }

    .laptop {
      position: absolute;
      left: 90px;
      bottom: 20px;

      width: 190px;
      height: 115px;

      border: 7px solid #8b82d8;
      border-bottom-width: 14px;

      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #29274e,
        #11142b
      );

      transform: perspective(500px) rotateX(3deg);
    }

    .laptop::after {
      content: "";

      position: absolute;
      left: -30px;
      bottom: -25px;

      width: 245px;
      height: 15px;

      border-radius: 50px;

      background: #7e78b9;
    }

    .plant {
      position: absolute;
      left: 300px;
      bottom: 20px;

      font-size: 60px;
    }

    /* =========================
       FORM CARD
    ========================= */

    .contact-form-card {
      padding: 38px;

      border: 1px solid rgba(150, 150, 220, 0.18);
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(28, 32, 63, 0.9),
          rgba(16, 19, 43, 0.85)
        );

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;

      margin-bottom: 10px;

      color: #ddddef;

      font-size: 16px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;

      left: 18px;
      top: 50%;

      transform: translateY(-50%);

      color: #9c91ff;

      font-size: 19px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;

      padding: 17px 18px 17px 52px;

      border: 1px solid rgba(170, 170, 220, 0.22);
      border-radius: 16px;

      outline: none;

      background: rgba(32, 36, 65, 0.8);

      color: #fff;

      font-size: 15px;

      transition: 0.3s ease;
    }

    textarea.form-control {
      min-height: 145px;
      resize: vertical;

      padding-top: 18px;
    }

    .form-control::placeholder {
      color: #8588a9;
    }

    .form-control:focus {
      border-color: #7565ff;

      box-shadow:
        0 0 0 3px rgba(111, 93, 255, 0.12),
        0 0 25px rgba(111, 93, 255, 0.12);
    }

    /* =========================
       BUTTON
    ========================= */

    .submit-btn {
      width: 100%;

      padding: 18px;

      border: none;
      border-radius: 35px;

      background: linear-gradient(
        90deg,
        #735cff,
        #4b67ff
      );

      color: #080a19;

      font-size: 17px;
      font-weight: 800;

      cursor: pointer;

      transition: 0.3s ease;

      box-shadow:
        0 15px 35px rgba(93, 78, 255, 0.35);
    }

    .submit-btn:hover {
      transform: translateY(-3px);

      box-shadow:
        0 20px 45px rgba(93, 78, 255, 0.5);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* =========================
       SUCCESS MESSAGE
    ========================= */

    .success-message {
      display: none;

      margin-top: 18px;
      padding: 14px;

      border-radius: 12px;

      text-align: center;

      background: rgba(53, 211, 153, 0.1);
      border: 1px solid rgba(53, 211, 153, 0.3);

      color: #61e6b0;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

      .contact-container {
        grid-template-columns: 1fr;

        gap: 50px;

        padding: 40px;
      }

      .contact-title {
        max-width: 700px;
      }

      .decoration {
        display: none;
      }
    }

    @media (max-width: 600px) {

      .contact-section {
        padding: 15px;
      }

      .contact-container {
        padding: 28px 20px;

        border-radius: 22px;
      }

      .contact-form-card {
        padding: 22px 17px;
      }

      .contact-title {
        font-size: 45px;
        letter-spacing: -2px;
      }

      .contact-description {
        font-size: 15px;
      }

      .contact-links {
        flex-direction: column;
        align-items: flex-start;
      }

      .contact-label {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <section class="contact-section">

    <div class="contact-container">

      <!-- ================= LEFT ================= -->

      <div class="contact-left">

        <div class="contact-label">
          05 — CONTACT
        </div>

        <h1 class="contact-title">
          Have a
          <span class="gradient-text">product</span>
          or
          <span class="gradient-text">design</span>
          role in mind?
        </h1>

        <p class="contact-description">
          Let's talk about UI/UX work, portfolio projects,
          freelance collaboration, or full-time opportunities.
        </p>

        <div class="contact-links">

          <a
            href="mailto:yourmail@gmail.com"
            class="contact-link"
          >
            <span class="link-icon">✉</span>

            <span class="link-text">
              <small>Email Me</small>
              yourmail@gmail.com
            </span>
          </a>

          <a
            href="https://www.behance.net/"
            target="_blank"
            class="contact-link"
          >
            <span class="link-icon">Bē</span>

            <span class="link-text">
              <small>Portfolio</small>
              Behance
            </span>
          </a>

          <a
            href="https://www.linkedin.com/"
            target="_blank"
            class="contact-link"
          >
            <span class="link-icon">in</span>

            <span class="link-text">
              <small>Connect</small>
              LinkedIn
            </span>
          </a>

        </div>

        <div class="decoration">

          <div class="blob"></div>

          <div class="laptop"></div>

          <div class="plant">
            🌱
          </div>

        </div>

      </div>


      <!-- ================= FORM ================= -->

      <div class="contact-form-card">

        <form id="contactForm">

          <!-- Name -->

          <div class="form-group">

            <label for="name">
              Name
            </label>

            <div class="input-wrapper">

              <span class="input-icon">
                ♙
              </span>

              <input
                type="text"
                id="name"
                class="form-control"
                placeholder="Your name"
                required
              />

            </div>

          </div>


          <!-- Email -->

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <div class="input-wrapper">

              <span class="input-icon">
                ✉
              </span>

              <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Your email address"
                required
              />

            </div>

          </div>


          <!-- Message -->

          <div class="form-group">

            <label for="message">
              Message
            </label>

            <div class="input-wrapper">

              <span
                class="input-icon"
                style="top: 25px;"
              >
                💬
              </span>

              <textarea
                id="message"
                class="form-control"
                placeholder="Tell me about your project..."
                required
              ></textarea>

            </div>

          </div>


          <!-- Button -->

          <button
            type="submit"
            class="submit-btn"
          >
            ✈ &nbsp; Email Me
          </button>


          <div
            class="success-message"
            id="successMessage"
          >
            ✓ Thank you! Your message is ready to send.
          </div>

        </form>

      </div>

    </div>

  </section>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const contactForm =
      document.getElementById("contactForm");

    const successMessage =
      document.getElementById("successMessage");


    contactForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const message =
        document.getElementById("message").value.trim();


      if (!name || !email || !message) {

        alert("Please fill in all fields.");

        return;
      }


      // Create email content

      const subject =
        encodeURIComponent(
          "New Portfolio Contact from " + name
        );

      const body =
        encodeURIComponent(
          "Name: " + name +
          "\nEmail: " + email +
          "\n\nMessage:\n" + message
        );


      // Replace this email with your actual email

      const yourEmail =
        "yourmail@gmail.com";


      // Open user's email application

      window.location.href =
        `mailto:${yourEmail}?subject=${subject}&body=${body}`;


      successMessage.style.display =
        "block";

    });

  </script>

</body>
</html>
